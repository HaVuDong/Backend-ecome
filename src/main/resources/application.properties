spring.application.name=ecome-backend

# MySQL - Dùng biến môi trường cho production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ecome?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari connection pool tuning (recommended)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/images

# CORS (cho React Native)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Cloudinary configuration (set via env vars in production)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Flyway migrations (add SQL files under src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ------------------ AI / OpenAI Configuration ------------------
# AI features have been moved to the standalone service `Aiboxecome`.
# To enable legacy in-process AI features, set `aibox.enabled=true` and configure OpenAI keys accordingly.
# Additionally, to allow AIbox service to post assistant messages, set a service key and keep it secret.
# To enable: set AIBOX_SERVICE_KEY in your environment and aibox.enabled=true
# aibox.service-key=${AIBOX_SERVICE_KEY:}
# Development: allow Aibox posts from local service (shared secret)
aibox.service-key=local-aibox-key-please-change
# Provider: openai or azure (currently only openai supported by client)
# openai.provider=${PROVIDER:openai}
# openai.api-key=${OPENAI_API_KEY:}
# openai.model=${OPENAI_MODEL:gpt-4o-mini}
# openai.temperature=${OPENAI_TEMPERATURE:0.2}
# openai.request-timeout-ms=${OPENAI_REQUEST_TIMEOUT:30000}

