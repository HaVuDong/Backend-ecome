# Disable Spring DevTools restart when running locally to avoid classloader issues during rapid edits
# Set SPRING_DEVTOOLS_RESTART=true to enable if you need automatic restart
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART:false}