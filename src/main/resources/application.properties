vnpay.tmn-code=${VNPAY_TMN_CODE:3B16K5YQ}
vnpay.hash-secret=${VNPAY_HASH_SECRET:SXSOHRK9I5DAAP2I5QA3Z839XPS3YX3B}
vnpay.return-url=${VNPAY_RETURN_URL:https://pay.example.com/api/payment/vnpay/return}
vnpay.sandbox-payment-url=${VNPAY_SANDBOX_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
