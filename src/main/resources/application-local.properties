# Local profile for development — use H2 in-memory database to avoid requiring a local MySQL server
spring.datasource.url=jdbc:h2:mem:ecome;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SMS provider (no default — set SMS_PROVIDER=dev or SMS_PROVIDER=twilio_verify)
sms.provider=${SMS_PROVIDER:}

# Server
server.port=8080
